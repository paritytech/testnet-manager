[tool.poetry]
name = "testnet-manager"
version = "1.1.0"
description = "DevOps toolkit to operate Polkadot testnets"
authors = ["Devops Parity"]

[tool.poetry.dependencies]
python = "^3.11"
PyYAML = "^6.0"
APScheduler = "^3.10.1"
gunicorn = "^20.1.0"
uvicorn = "^0.21.1"
kubernetes = "^27.2.0"
substrate-interface = "^1.7.9"
# Direct dep (also pulled by substrate-interface): used for BEEFY/ecdsa
# proof-of-possession signing over a blake2_256 prehash in the offline key path.
eth-keys = "^0.5.1"
Jinja2 = "^3.1.3"
fastapi = "^0.109.1"
python-multipart = "^0.0.7"

[tool.poetry.dev-dependencies]
testcontainers = "^4.0"
pytest = "^7.2.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
